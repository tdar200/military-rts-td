name: CI

on:
  push:
  pull_request:

# Note: warnings are denied via the workspace `[lints]` table, not a global
# RUSTFLAGS: a RUSTFLAGS env would override the wasm `--allow-undefined`
# link-arg in .cargo/config.toml that macroquad needs.
env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # Strict gate: any warning, any pedantic/nursery violation, and (in `core`)
      # any float arithmetic fails the build.
      - name: Clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (headless core + workspace)
        run: cargo test --workspace

      # Prove the core and the render shell both compile to the browser target.
      - name: Build core + shell for WASM
        run: cargo build -p rts-core -p rts-render-shell --target wasm32-unknown-unknown

  deny:
    name: cargo-deny (licenses · advisories · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Godot client suite, headless with the dummy audio driver. The editor binary is
  # cached by version; a miss downloads the release zip. `tools/godot/` is
  # gitignored, so this is also what a fresh checkout does locally.
  godot:
    name: godot headless suite
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_BIN: tools/godot/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: tools/godot/Godot_v4.7.2-stable_linux.x86_64
          key: godot-4.7.2-stable-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/godot
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -o "$RUNNER_TEMP/godot.zip" -d tools/godot
          chmod +x "$GODOT_BIN"

      # A fresh checkout has no `godot3d/.godot/` import cache (gitignored); the
      # editor's headless import builds it so textures, fonts and audio resolve. The
      # first pass can segfault while importing fonts (seen locally, rerun is clean),
      # so it is retried up to three times.
      - name: Import project resources
        run: |
          for attempt in 1 2 3; do
            if "$GODOT_BIN" --headless --audio-driver Dummy --path godot3d --import; then
              exit 0
            fi
            echo "::warning::Godot import attempt $attempt failed"
          done
          exit 1

      # The runner exits 1 on any failed assertion. The log scan also fails the job on
      # engine-level SCRIPT ERROR / SHADER ERROR / ERROR lines that do not fail a test.
      - name: Run the suite
        run: |
          set +e
          "$GODOT_BIN" --headless --audio-driver Dummy --path godot3d \
            --script res://tests/run_tests.gd 2>&1 | tee "$RUNNER_TEMP/godot-suite.log"
          status=${PIPESTATUS[0]}
          set -e
          if grep -nE 'SCRIPT ERROR|SHADER ERROR|^ERROR' "$RUNNER_TEMP/godot-suite.log"; then
            echo "::error::the Godot log contains SCRIPT ERROR, SHADER ERROR or ERROR lines"
            exit 1
          fi
          exit "$status"

  # Offline Python tooling tests (numpy / Pillow / SciPy only, no network, no GPU).
  python-tools:
    name: python tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to the versions the committed sprites were generated with: the sprite
      # freshness tests compare a fresh build to the PNGs, and newer Pillow, NumPy and
      # SciPy releases move pixels enough to fail them.
      - name: Install dependencies
        run: python -m pip install numpy==1.26.4 pillow==10.2.0 scipy==1.11.4 pyyaml

      - name: UI tool tests
        working-directory: tools/ui
        run: python -m unittest test_world_diff test_build_prop_atlas test_build_building_variants test_build_fx_atlas -v

      - name: Audio tool tests
        working-directory: tools/audio
        run: python -m unittest test_build_sfx test_quiet_launchers test_listen_pass -v

      - name: Perf tool tests (refusal and dry-run only; the script is never run here)
        working-directory: tools/perf
        run: python -m unittest test_gpu_frametime -v

      - name: CI workflow checker tests
        working-directory: tools/ci
        run: python -m unittest test_check_ci_yaml -v
