<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440"><defs><style>@font-face{font-family:Rajdhani;src:url(../fonts/Rajdhani-SemiBold.ttf)}text{font-family:DejaVu Sans,sans-serif}.head{font-family:Rajdhani,DejaVu Sans,sans-serif;font-weight:600}</style><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#f17d74" opacity=".5"/></pattern></defs><rect x="0" y="0" width="1920" height="1440" rx="0" fill="#090e12"/><defs><clipPath id="terrainClip"><rect x="32" y="260" width="1220" height="638"/></clipPath></defs><text x="32" y="40" font-size="23" fill="#76d5c5" class="head">A / ASCENSION</text><text x="1315" y="39" font-size="14" fill="#a4b8bb">DETAILED GAMEPLAY DESIGN  /  PROPOSED</text><text x="32" y="86" font-size="14" fill="#a4b8bb">05 / RESEARCH, PROTOTYPES &amp; ERA ADVANCEMENT</text><text x="32" y="144" font-size="48" fill="#eaf0e7" class="head">Knowledge is not industrial capacity.</text><text x="34" y="181" font-size="17" fill="#a4b8bb">A robotic-workcell prototype reserves one factory. Decide whether the long-term productivity gain justifies fewer tanks now.</text><rect x="32" y="213" width="1220" height="47" rx="0" fill="#121e25" stroke="#354951"/><text x="49" y="243" font-size="13" fill="#eaf0e7">SCIENCE 62% theory</text><text x="355" y="243" font-size="13" fill="#eaf0e7">PROTOTYPE 0 / 1</text><text x="661" y="243" font-size="13" fill="#eab56b">FACTORY 01 reserved</text><text x="967" y="243" font-size="13" fill="#eaf0e7">POWER 30 kW needed</text><rect x="32" y="260" width="1220" height="638" rx="0" fill="#101920"/><text x="70" y="306" font-size="15" fill="#76d5c5">01 / DISCOVER</text><text x="455" y="306" font-size="15" fill="#76d5c5">02 / VALIDATE</text><text x="840" y="306" font-size="15" fill="#76d5c5">03 / COMMISSION</text><path d="M381 409h65" fill="none" stroke="#76d5c5" stroke-width="3" opacity="1"/><path d="M435 402l11 7 -11 7" fill="none" stroke="#76d5c5" stroke-width="2" opacity="1"/><path d="M766 409h65" fill="none" stroke="#76d5c5" stroke-width="3" opacity="1"/><path d="M820 402l11 7 -11 7" fill="none" stroke="#76d5c5" stroke-width="2" opacity="1"/><rect x="70" y="350" width="330" height="121" rx="0" fill="#1d2d35" stroke="#354951"/><text x="87" y="379" font-size="12" fill="#76d5c5">COMPLETE</text><text x="87" y="413" font-size="24" fill="#eaf0e7" class="head">Advanced computing</text><text x="87" y="447" font-size="13" fill="#a4b8bb">8 lab teams • 100%</text><rect x="70" y="501" width="330" height="121" rx="0" fill="#1d2d35" stroke="#354951"/><text x="87" y="530" font-size="12" fill="#76d5c5">COMPLETE</text><text x="87" y="564" font-size="24" fill="#eaf0e7" class="head">Precision manufacturing</text><text x="87" y="598" font-size="13" fill="#a4b8bb">Materials lab • 100%</text><rect x="455" y="350" width="330" height="121" rx="0" fill="#1d2d35" stroke="#76d5c5"/><text x="472" y="379" font-size="12" fill="#76d5c5">ACTIVE / 62%</text><text x="472" y="413" font-size="24" fill="#eaf0e7" class="head">Robotic-workcell theory</text><text x="472" y="447" font-size="13" fill="#a4b8bb">12 compute units • 60 kW</text><rect x="455" y="501" width="330" height="121" rx="0" fill="#1d2d35" stroke="#354951"/><text x="472" y="530" font-size="12" fill="#eab56b">WAITING FOR THEORY</text><text x="472" y="564" font-size="24" fill="#eaf0e7" class="head">Factory prototype</text><text x="472" y="598" font-size="13" fill="#a4b8bb">Factory 01 reserved • 30 kW</text><rect x="840" y="350" width="330" height="121" rx="0" fill="#1d2d35" stroke="#354951"/><text x="857" y="379" font-size="12" fill="#76d5c5">LOCKED / TOOLING</text><text x="857" y="413" font-size="24" fill="#eaf0e7" class="head">Install first workcell</text><text x="857" y="447" font-size="13" fill="#a4b8bb">120 materials • 20 s downtime</text><rect x="840" y="501" width="330" height="121" rx="0" fill="#1d2d35" stroke="#354951"/><text x="857" y="530" font-size="12" fill="#76d5c5">COMMISSION TO ADVANCE</text><text x="857" y="564" font-size="24" fill="#eaf0e7" class="head">ERA 02 / INDUSTRIAL</text><text x="857" y="598" font-size="13" fill="#a4b8bb">Unlocks automation + new grids</text><path d="M400 563H424V410H455" fill="none" stroke="#76d5c5" stroke-width="2" opacity="1"/><path d="M620 471v30" fill="none" stroke="#76d5c5" stroke-width="2" opacity="1"/><path d="M785 562h30V410h25" fill="none" stroke="#76d5c5" stroke-width="2" opacity="1"/><rect x="70" y="671" width="1100" height="165" rx="0" fill="#121e25" stroke="#354951"/><text x="90" y="704" font-size="13" fill="#eab56b">THE OPPORTUNITY COST IS VISIBLE</text><text x="90" y="743" font-size="24" fill="#eaf0e7" class="head">Factory 01: prototype reservation</text><text x="90" y="780" font-size="18" fill="#76d5c5">Factory 02: tank queue continues</text><text x="685" y="744" font-size="31" fill="#eaf0e7" class="head">12 → 15 work/s</text><text x="685" y="782" font-size="16" fill="#a4b8bb">30 s → 24 s per tank at full supply</text><rect x="32" y="898" width="1220" height="77" rx="0" fill="#121e25" stroke="#354951"/><rect x="53" y="914" width="211" height="44" rx="0" fill="#1d2d35" stroke="#76d5c5"/><text x="68" y="943" font-size="15" fill="#eaf0e7">Enter   Fund theory</text><rect x="284" y="914" width="211" height="44" rx="0" fill="#1d2d35" stroke="#354951"/><text x="299" y="943" font-size="15" fill="#eaf0e7">P   Pin path</text><rect x="515" y="914" width="211" height="44" rx="0" fill="#1d2d35" stroke="#354951"/><text x="530" y="943" font-size="15" fill="#eaf0e7">F   Factory</text><rect x="746" y="914" width="211" height="44" rx="0" fill="#1d2d35" stroke="#354951"/><text x="761" y="943" font-size="15" fill="#eaf0e7">Q   Queue</text><rect x="977" y="914" width="211" height="44" rx="0" fill="#1d2d35" stroke="#354951"/><text x="992" y="943" font-size="15" fill="#eaf0e7">Esc   Close</text><rect x="1280" y="213" width="608" height="762" rx="0" fill="#121e25" stroke="#354951"/><text x="1306" y="247" font-size="13" fill="#76d5c5">PLAYER DECISION</text><text x="1306" y="284" font-size="27" fill="#eaf0e7">Commit the factory, or postpone the</text><text x="1306" y="320" font-size="27" fill="#eaf0e7">era transition?</text><path d="M1306 361H1860" fill="none" stroke="#354951" stroke-width="1" opacity="1"/><text x="1306" y="388" font-size="13" fill="#76d5c5">ROBOTIC WORKCELLS</text><text x="1306" y="417" font-size="17" fill="#a4b8bb">Advanced computing + precision manufacturing → theory →</text><text x="1306" y="442" font-size="17" fill="#a4b8bb">powered prototype → commissioning.</text><path d="M1306 486H1860" fill="none" stroke="#354951" stroke-width="1" opacity="1"/><text x="1306" y="513" font-size="13" fill="#eab56b">EXPLICIT OPPORTUNITY COST</text><text x="1306" y="542" font-size="17" fill="#a4b8bb">Factory 01 is reserved for the prototype. Factory 02</text><text x="1306" y="567" font-size="17" fill="#a4b8bb">keeps its tank queue. No hidden suspension of all</text><text x="1306" y="592" font-size="17" fill="#a4b8bb">military production.</text><path d="M1306 636H1860" fill="none" stroke="#354951" stroke-width="1" opacity="1"/><text x="1306" y="663" font-size="13" fill="#eaf0e7">ERA ADVANCEMENT</text><text x="1306" y="692" font-size="17" fill="#a4b8bb">Validate the prototype and commission the first</text><text x="1306" y="717" font-size="17" fill="#a4b8bb">workcell. Unlock Era 02 infrastructure; existing tanks</text><text x="1306" y="742" font-size="17" fill="#a4b8bb">keep their model and role.</text><path d="M1306 786H1860" fill="none" stroke="#354951" stroke-width="1" opacity="1"/><text x="1306" y="813" font-size="13" fill="#aba5e9">SCIENCE LABEL</text><text x="1306" y="842" font-size="17" fill="#a4b8bb">Engineering extrapolation. Robotics is established;</text><text x="1306" y="867" font-size="17" fill="#a4b8bb">flexible reliable automation at this scale depends on</text><text x="1306" y="892" font-size="17" fill="#a4b8bb">engineering and energy.</text><text x="32" y="1017" font-size="14" fill="#76d5c5">INTERACTION STATES / INPUT → FEEDBACK → SIMULATION CONSEQUENCE</text><rect x="32" y="1040" width="604" height="292" rx="0" fill="#121e25" stroke="#354951"/><rect x="32" y="1040" width="604" height="3" rx="0" fill="#76d5c5"/><text x="54" y="1078" font-size="16" fill="#76d5c5">THEORY / LAB-BOUND</text><text x="54" y="1116" font-size="22" fill="#eaf0e7">Fund the project with prerequisites met</text><text x="54" y="1188" font-size="17" fill="#a4b8bb">Computing and staffed laboratories advance theory. Show</text><text x="54" y="1215" font-size="17" fill="#a4b8bb">effective rate and the current bottleneck; more power</text><text x="54" y="1242" font-size="17" fill="#a4b8bb">alone cannot replace experiments.</text><rect x="657" y="1040" width="604" height="292" rx="0" fill="#121e25" stroke="#354951"/><rect x="657" y="1040" width="604" height="3" rx="0" fill="#eab56b"/><text x="679" y="1078" font-size="16" fill="#eab56b">PROTOTYPE / FACTORY-BOUND</text><text x="679" y="1116" font-size="22" fill="#eaf0e7">Theory complete; reserve one factory</text><text x="679" y="1188" font-size="17" fill="#a4b8bb">Pause only the chosen production bay. Factory</text><text x="679" y="1215" font-size="17" fill="#a4b8bb">destruction transfers to a valid replacement; otherwise</text><text x="679" y="1242" font-size="17" fill="#a4b8bb">preserve progress in a halted state.</text><rect x="1282" y="1040" width="604" height="292" rx="0" fill="#121e25" stroke="#354951"/><rect x="1282" y="1040" width="604" height="3" rx="0" fill="#aba5e9"/><text x="1304" y="1078" font-size="16" fill="#aba5e9">DEPLOY / ECONOMY-BOUND</text><text x="1304" y="1116" font-size="22" fill="#eaf0e7">Prototype validated and tooling built</text><text x="1304" y="1188" font-size="17" fill="#a4b8bb">Commission the first upgraded line, unlock Era 02 and</text><text x="1304" y="1215" font-size="17" fill="#a4b8bb">offer optional retrofits. No automatic empire-wide</text><text x="1304" y="1242" font-size="17" fill="#a4b8bb">transformation.</text><text x="32" y="1373" font-size="13" fill="#76d5c5">DESIGN CONTRACT</text><text x="227" y="1373" font-size="15" fill="#eaf0e7">A prototype cannot advance without its powered required facility.</text><text x="32" y="1414" font-size="12" fill="#a4b8bb">Illustrative balance and future mechanics • Consult the companion interaction specification • No production game behaviour changed</text><text x="1640" y="1414" font-size="13" fill="#a4b8bb">ERA 01 → 02  /  05</text></svg>