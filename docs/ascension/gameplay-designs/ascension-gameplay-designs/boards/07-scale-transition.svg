<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440"><defs><style>@font-face{font-family:Rajdhani;src:url(../fonts/Rajdhani-SemiBold.ttf)}text{font-family:DejaVu Sans,sans-serif}.head{font-family:Rajdhani,DejaVu Sans,sans-serif;font-weight:600}</style><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#f17d74" opacity=".5"/></pattern></defs><rect x="0" y="0" width="1920" height="1440" rx="0" fill="#090e12"/><defs><clipPath id="terrainClip"><rect x="32" y="260" width="1220" height="638"/></clipPath></defs><text x="32" y="40" font-size="23" fill="#76d5c5" class="head">A / ASCENSION</text><text x="1315" y="39" font-size="14" fill="#a4b8bb">DETAILED GAMEPLAY DESIGN  /  PROPOSED</text><text x="32" y="86" font-size="14" fill="#a4b8bb">07 / PLANETARY &amp; SOLAR STRATEGY TRANSITION</text><text x="32" y="144" font-size="48" fill="#eaf0e7" class="head">Zoom out without throwing your army away.</text><text x="34" y="181" font-size="17" fill="#a4b8bb">Delegate stabilized regions, preserve their ledgers and retain direct command of strategically important operations.</text><rect x="32" y="213" width="1220" height="47" rx="0" fill="#121e25" stroke="#354951"/><text x="49" y="243" font-size="13" fill="#eaf0e7">POWER 4.8 / 6.2 TW</text><text x="355" y="243" font-size="13" fill="#eaf0e7">INDUSTRY 8.4 Mt/yr</text><text x="661" y="243" font-size="13" fill="#eab56b">FLEETS 6 task forces</text><text x="967" y="243" font-size="13" fill="#eaf0e7">TRANSIT 82%</text><rect x="32" y="260" width="1220" height="638" rx="0" fill="#0b121b"/><circle cx="49" cy="281" r="2" fill="#adbbd4" opacity="0.2"/><circle cx="222" cy="370" r="1" fill="#adbbd4" opacity="0.32"/><circle cx="395" cy="459" r="1" fill="#adbbd4" opacity="0.44"/><circle cx="568" cy="548" r="1" fill="#adbbd4" opacity="0.56"/><circle cx="741" cy="637" r="1" fill="#adbbd4" opacity="0.2"/><circle cx="914" cy="726" r="1" fill="#adbbd4" opacity="0.32"/>