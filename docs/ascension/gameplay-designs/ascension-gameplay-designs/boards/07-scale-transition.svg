638" cy="318" r="2" fill="#adbbd4" opacity="0.32"/><circle cx="811" cy="407" r="1" fill="#adbbd4" opacity="0.44"/><circle cx="984" cy="496" r="1" fill="#adbbd4" opacity="0.56"/><circle cx="1157" cy="585" r="1" fill="#adbbd4" opacity="0.2"/><circle cx="150" cy="674" r="1" fill="#adbbd4" opacity="0.32"/><circle cx="323" cy="763" r="1" fill="#adbbd4" opacity="0.44"/><circle cx="496" cy="852" r="1" fill="#adbbd4" opacity="0.56"/><circle cx="669" cy="351" r="2" fill="#adbbd4" opacity="0.2"/><circle cx="842" cy="440" r="1" fill="#adbbd4" opacity="0.32"/><circle cx="1015" cy="529" r="1" fill="#adbbd4" opacity="0.44"/><circle cx="1188" cy="618" r="1" fill="#adbbd4" opacity="0.56"/><circle cx="181" cy="707" r="1" fill="#adbbd4" opacity="0.2"/><ellipse cx="630" cy="563" rx="180" ry="91" fill="none" stroke="#334a54"/><ellipse cx="630" cy="563" rx="306" ry="164" fill="none" stroke="#334a54"/><ellipse cx="630" cy="563" rx="475" ry="248" fill="none" stroke="#334a54"/><circle cx="630" cy="563" r="38" fill="#eab56b" opacity="1"/><circle cx="630" cy="563" r="58" fill="#eab56b" opacity="0.08"/><path d="M420 471Q531 324 803 435T988 665Q627 815 420 471" fill="none" stroke="#76d5c5" stroke-width="2" opacity="1" stroke-dasharray="8 8"/><text x="645" y="758" font-size="14" fill="#76d5c5">IN TRANSIT / 100 kt</text><circle cx="420" cy="471" r="13" fill="#76d5c5" opacity="1"/><circle cx="420" cy="471" r="23" fill="none" opacity="1" stroke="#76d5c5"/><text x="451" y="462" font-size="16" fill="#76d5c5" class="head">EARTH / 1,200 kt</text><circle cx="803" cy="435" r="13" fill="#eab56b" opacity="1"/><circle cx="803" cy="435" r="23" fill="none" opacity="1" stroke="#eab56b"/><text x="834" y="426" font-size="16" fill="#eab56b" class="head">MARS / 800 kt</text><circle cx="988" cy="665" r="13" fill="#76d5c5" opacity="1"/><circle cx="988" cy="665" r="23" fill="none" opacity="1" stroke="#76d5c5"/><text x="1019" y="656" font-size="16" fill="#76d5c5" class="head">CERES LOGISTICS</text><rect x="64" y="796" width="1150" height="67" rx="0" fill="#121e25" stroke="#354951"/><text x="84" y="824" font-size="15" fill="#76d5c5">POLICY: CIVILIAN 55%  /  DEFENCE 20%  /  EXPANSION 25%</text><text x="84" y="849" font-size="13" fill="#a4b8bb">No inhabited-world disassembly • Escalate civilian route loss • Preserve local reserves</text><rect x="32" y="898" width="1220" height="77" rx="0" fill="#121e25" stroke="#354951"/><rect x="53" y="914" width="211" height="44" rx="0" fill="#1d2d35" stroke="#76d5c5"/><text x="68" y="943" font-size="15" fill="#eaf0e7">Tab   Change scale</text><rect x="284" y="914" width="211" height="44" rx="0" fill="#1d2d35" stroke="#354951"/><text x="299" y="943" font-size="15" fill="#eaf0e7">G   Governors</text><rect x="515" y="914" width="211" height="44" rx="0" fill="#1d2d35" stroke="#354951"/><text x="530" y="943" font-size="15" fill="#eaf0e7">O   Orders</text><rect x="746" y="914" width="211" height="44" rx="0" fill="#1d2d35" stroke="#354951"/><text x="761" y="943" font-size="15" fill="#eaf0e7">L   Logistics</text><rect x="977" y="914" width="211" height="44" rx="0" fill="#1d2d35" stroke="#354951"/><text x="992" y="943" font-size="15" fill="#eaf0e7">Esc   Back</text><rect x="1280" y="213" width="608" height="762" rx="0" fill="#121e25" stroke="#354951"/><text x="1306" y="247" font-size="13" fill="#76d5c5">PLAYER DECISION</text><text x="1306" y="284" font-size="27" fill="#eaf0e7">How much authority should a</text><text x="1306" y="320" font-size="27" fill="#eaf0e7">planetary governor have?</text><path d="M1306 361H1860" fill="none" stroke="#354951" stroke-width="1" opacity="1"/><text x="1306" y="388" font-size="13" fill="#76d5c5">REGION → PLANET → SYSTEM</text><text x="1306" y="417" font-size="17" fill="#a4b8bb">A region becomes a persistent production and defence</text><text x="1306" y="442" font-size="17" fill="#a4b8bb">contract, not a freshly minted resource bonus.</text><path d="M1306 486H1860" fill="none" stroke="#354951" stroke-width="1" opacity="1"/><text x="1306" y="513" font-size="13" fill="#eab56b">CONSERVATION EXAMPLE</text><text x="1306" y="542" font-size="17" fill="#a4b8bb">Earth 1,200 + Mars 800 + in transit 100 = 2,100 kt</text><text x="1306" y="567" font-size="17" fill="#a4b8bb">before and after aggregation. Transit stock belongs to</text><text x="1306" y="592" font-size="17" fill="#a4b8bb">one shipment.</text><path d="M1306 636H1860" fill="none" stroke="#354951" stroke-width="1" opacity="1"/><text x="1306" y="663" font-size="13" fill="#eaf0e7">GOVERNOR CONTRACT</text><text x="1306" y="692" font-size="17" fill="#a4b8bb">Civilian minimum 55%; defence reserve 20%; expansion up</text><text x="1306" y="717" font-size="17" fill="#a4b8bb">to 25%. Cannot overspend, disassemble inhabited assets</text><text x="1306" y="742" font-size="17" fill="#a4b8bb">or change species policy.</text><path d="M1306 786H1860" fill="none" stroke="#354951" stroke-width="1" opacity="1"/><text x="1306" y="813" font-size="13" fill="#aba5e9">PLAYER AGENCY</text><text x="1306" y="842" font-size="17" fill="#a4b8bb">Set objectives, budgets and fallback doctrine.</text><text x="1306" y="867" font-size="17" fill="#a4b8bb">Exceptions open an operation card with the exact</text><text x="1306" y="892" font-size="17" fill="#a4b8bb">shortage, route risk and available intervention.</text><text x="32" y="1017" font-size="14" fill="#76d5c5">INTERACTION STATES / INPUT → FEEDBACK → SIMULATION CONSEQUENCE</text><rect x="32" y="1040" width="604" height="292" rx="0" fill="#121e25" stroke="#354951"/><rect x="32" y="1040" width="604" height="3" rx="0" fill="#76d5c5"/><text x="54" y="1078" font-size="16" fill="#76d5c5">DELEGATE / PREVIEW</text><text x="54" y="1116" font-size="22" fill="#eaf0e7">Choose a stable region</text><text x="54" y="1188" font-size="17" fill="#a4b8bb">Show inventories, work rates, garrisons and standing</text><text x="54" y="1215" font-size="17" fill="#a4b8bb">orders that will be retained. No conversion until the</text><text x="54" y="1242" font-size="17" fill="#a4b8bb">player confirms the contract.</text><rect x="657" y="1040" width="604" height="292" rx="0" fill="#121e25" stroke="#354951"/><rect x="657" y="1040" width="604" height="3" rx="0" fill="#eab56b"/><text x="679" y="1078" font-size="16" fill="#eab56b">AGGREGATE / PRESERVE</text><text x="679" y="1116" font-size="22" fill="#eaf0e7">Transfer authority at a tick boundary</text><text x="679" y="1188" font-size="17" fill="#a4b8bb">Store one ownership ledger. Disable duplicate low-level</text><text x="679" y="1215" font-size="17" fill="#a4b8bb">simulation of the same inventory; preserve queues and</text><text x="679" y="1242" font-size="17" fill="#a4b8bb">transit in the aggregate model.</text><rect x="1282" y="1040" width="604" height="292" rx="0" fill="#121e25" stroke="#354951"/><rect x="1282" y="1040" width="604" height="3" rx="0" fill="#aba5e9"/><text x="1304" y="1078" font-size="16" fill="#aba5e9">RE-ENTER / INSPECT</text><text x="1304" y="1116" font-size="22" fill="#eaf0e7">Open a threatened operation</text><text x="1304" y="1188" font-size="17" fill="#a4b8bb">Restore or deterministically instantiate the tactical</text><text x="1304" y="1215" font-size="17" fill="#a4b8bb">state from the saved contract. Never spawn a new full</text><text x="1304" y="1242" font-size="17" fill="#a4b8bb">army in addition to the abstract one.</text><text x="32" y="1373" font-size="13" fill="#76d5c5">DESIGN CONTRACT</text><text x="227" y="1373" font-size="15" fill="#eaf0e7">Resource totals and military cohorts match before/after every scale change.</text><text x="32" y="1414" font-size="12" fill="#a4b8bb">Illustrative balance and future mechanics • Consult the companion interaction specification • No production game behaviour changed</text><text x="1640" y="1414" font-size="13" fill="#a4b8bb">ERA 03 → 04  /  07</text></svg>