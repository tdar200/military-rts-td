# Workspace root for the military RTS + tower-defense game.
#
# One shared, deterministic Rust core compiles to every target; the render shell
# and server are thin layers over it. See:
#   docs/superpowers/specs/2026-06-01-military-rts-td-design.md
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/data",
    "crates/render-shell",
    "crates/server",
]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "Proprietary"
publish = false

# Strictest-compiler posture, applied to every crate that opts in with
# `[lints] workspace = true`. The determinism-critical `clippy::float_arithmetic`
# deny is added per-crate (core only) — the shells legitimately use floats to draw.
[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[profile.release]
# Smallest WASM / fastest native: aggressive optimization + LTO.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
