# Workspace root for the military RTS + tower-defense game.
#
# One shared, deterministic Rust core compiles to every target; the render shell
# and server are thin layers over it. See:
#   docs/superpowers/specs/2026-06-01-military-rts-td-design.md
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/data",
    "crates/render-shell",
    "crates/server",
]

[workspace.package]
# The build's one version (Task 28): rts-server takes it, and it must equal
# godot3d/project.godot config/version (tools/release/test_package.py checks).
# core, data and render-shell keep their own 0.1.0.
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
license = "Proprietary"
publish = false

# Strictest-compiler posture, applied to every crate that opts in with
# `[lints] workspace = true`. The determinism-critical `clippy::float_arithmetic`
# deny is added per-crate (core only); the shells legitimately use floats to draw.
[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[profile.test]
# Long-horizon deterministic simulations run hundreds of thousands of ticks.
# Optimize test code so the full correctness suite remains practical in CI.
opt-level = 2

[profile.release]
# Smallest WASM / fastest native: aggressive optimization + LTO.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
