[package]
name = "rts-render-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rts"
path = "src/main.rs"

# Macroquad is the thin render/input shell. It compiles to desktop natively and
# to the browser via wasm32 (and to mobile via miniquad). The deterministic
# simulation stays entirely in rts-core.
[dependencies]
rts-core = { path = "../core" }
macroquad = "0.4"

# Audio is opt-in: it pulls quad-snd, which links ALSA on Linux (needs
# `libasound2-dev` natively). Off by default so bare-Linux CI builds with no
# extra system packages; enable for real builds: `cargo build --features audio`.
# (Web/wasm uses WebAudio and needs no system dep.)
[features]
audio = ["macroquad/audio"]

[lints]
workspace = true

# Android packaging config, read by `cargo-apk` (see MOBILE.md). Ignored by a
# normal `cargo build`.
[package.metadata.android]
package = "com.example.militaryrts"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
assets = "../../web"

[package.metadata.android.application]
label = "Stellar Front"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 33
