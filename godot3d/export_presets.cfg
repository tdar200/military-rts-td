; Task 28 release presets. tools/release/package.sh exports them (it needs the Godot 4.7.2 export templates);
; tools/release/test_package.py pins both presets' filters, and tools/release/pck.py checks the exported pack.
; The pack ships the game only: tests (fixtures and the stub bridge), QA tools, the dev runtime dir, the capture
; gallery, concept art, docs and .uid noise stay out. The two JSON data files the game reads raw (FileAccess, not the
; importer) ride the include filter. Imported files (textures, models, fonts, audio) ship only in imported form, so the
; game must load() them, never read the source file (scripts/ui/tokens.gd takes its fonts' bytes from load()).
; The bridge (godot-bridge, godot-bridge.exe) is copied beside the executable by package.sh, not packed.
; The Godot editor may rewrite this file and drop these comments; keep the filters.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/*.json"
exclude_filter="tests/*, tools/*, runtime/*, scripts/gallery/*, art/*, *.md, *.uid, *.sh, *.py, *.pyc"
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

